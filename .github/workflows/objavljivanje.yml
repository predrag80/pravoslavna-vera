# Провера, израда и постављање на хостинг после сваког push-а на main.
#
# Постављање зависи од тога који су подаци уписани у GitHub → Settings → Secrets and variables → Actions:
#  - FTP (класичан хостинг, cPanel): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR (нпр. /pravoslavna-vera.prowebsystems.rs/)
#  - SSH (VPS): SSH_HOST, SSH_USER, SSH_KEY (приватни кључ), SSH_DIR (нпр. /var/www/pravoslavna-vera), опционо SSH_PORT
#  - Заштита лозинком (само уз SSH, Apache/LiteSpeed): HTTP_AUTH_USER, HTTP_AUTH_PASS; брисањем тајни заштита се искључује
# Док ниједно није уписано, ток ради проверу и израду, а сајт се може преузети као „artifact“.
name: Objavljivanje

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: objavljivanje
  cancel-in-progress: true

jobs:
  objavi:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Сачувај изграђени сајт
        uses: actions/upload-artifact@v4
        with:
          name: sajt
          path: out
          retention-days: 7

      - name: Постављање преко FTP-а
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_DIR }}
          dangerous-clean-slate: false

      - name: Постављање преко SSH-а
        if: env.SSH_HOST != '' && env.FTP_SERVER == ''
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_DIR: ${{ secrets.SSH_DIR }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          HTTP_AUTH_USER: ${{ secrets.HTTP_AUTH_USER }}
          HTTP_AUTH_PASS: ${{ secrets.HTTP_AUTH_PASS }}
        run: |
          greska() { echo "::error title=SSH::$1"; exit 1; }
          PORT="${SSH_PORT:-22}"
          [ -n "$SSH_USER" ] || greska "Недостаје тајна SSH_USER."
          [ -n "$SSH_DIR" ] || greska "Недостаје тајна SSH_DIR."
          [ -n "$SSH_KEY" ] || greska "Недостаје тајна SSH_KEY."
          case "$SSH_DIR" in /*) ;; *) greska "SSH_DIR мора да буде пуна путања која почиње са / (сада почиње са '${SSH_DIR:0:1}')." ;; esac
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/kljuc && chmod 600 ~/.ssh/kljuc
          ssh-keygen -y -f ~/.ssh/kljuc > /dev/null 2>&1 || greska "SSH_KEY није исправан приватни кључ (треба цео садржај, са редовима BEGIN и END, без лозинке)."
          echo "::notice title=Отисак кључа::$(ssh-keygen -y -f ~/.ssh/kljuc | ssh-keygen -lf - | awk '{print $2, $4}')"
          timeout 20 bash -c "</dev/tcp/$SSH_HOST/$PORT" 2>/dev/null || greska "Сервер $SSH_HOST не прима везе на порту $PORT (погрешна адреса, порт или заштитни зид блокира GitHub)."
          ssh-keyscan -T 15 -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || greska "ssh-keyscan није успео за $SSH_HOST:$PORT."
          SSH="ssh -i $HOME/.ssh/kljuc -p $PORT -o BatchMode=yes -o ConnectTimeout=15"
          $SSH "$SSH_USER@$SSH_HOST" true 2>/tmp/ssh.err || greska "Пријава није успела за корисника $SSH_USER: $(tail -1 /tmp/ssh.err). Проверите да је јавни кључ у ~/.ssh/authorized_keys на серверу."
          $SSH "$SSH_USER@$SSH_HOST" "command -v rsync" >/dev/null || greska "На серверу није инсталиран rsync (нпр. sudo apt install rsync)."
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$SSH_DIR' && test -w '$SSH_DIR'" || greska "Корисник $SSH_USER нема право писања у SSH_DIR."
          SERVER=$(curl -sI "https://pravoslavna-vera.prowebsystems.rs/" | tr -d '\r' | awk -F': ' 'tolower($1)=="server"{print $2}')
          echo "::notice title=Веб сервер::${SERVER:-непознат}"
          # Заштита лозинком (HTTP Basic), док постоје тајне HTTP_AUTH_USER и HTTP_AUTH_PASS.
          # .htpasswd се чува ван јавне фасцикле, па га rsync --delete не брише, а посетиоци га не виде.
          if [ -n "$HTTP_AUTH_USER" ] && [ -n "$HTTP_AUTH_PASS" ]; then
            case "${SERVER,,}" in *nginx*) echo "::warning title=Заштита лозинком::Сервер је nginx; .htaccess се занемарује, па заштиту треба подесити у nginx конфигурацији." ;; esac
            ZASTITA_DIR=$($SSH "$SSH_USER@$SSH_HOST" "cd '$SSH_DIR/..' && pwd") || greska "Не могу да одредим фасциклу изнад SSH_DIR."
            HES=$(openssl passwd -apr1 "$HTTP_AUTH_PASS")
            printf '%s:%s\n' "$HTTP_AUTH_USER" "$HES" | $SSH "$SSH_USER@$SSH_HOST" "umask 022; cat > '$ZASTITA_DIR/.htpasswd-pravoslavna-vera'" || greska "Не могу да упишем .htpasswd на сервер."
            printf '\n# Заштита лозинком (поставља је објављивање)\nAuthType Basic\nAuthName "Pravoslavna vera - probna verzija"\nAuthUserFile %s/.htpasswd-pravoslavna-vera\nRequire valid-user\n' "$ZASTITA_DIR" >> out/.htaccess
            echo "::notice title=Заштита лозинком::Укључена за корисника $HTTP_AUTH_USER."
          else
            $SSH "$SSH_USER@$SSH_HOST" "rm -f '$SSH_DIR/../.htpasswd-pravoslavna-vera'" || true
            echo "::notice title=Заштита лозинком::Искључена (нема тајни HTTP_AUTH_USER и HTTP_AUTH_PASS)."
          fi
          rsync -az --delete -e "$SSH" out/ "$SSH_USER@$SSH_HOST:$SSH_DIR/" || greska "rsync није успео."
          echo "::notice title=SSH::Сајт је постављен."
          ADRESA="https://pravoslavna-vera.prowebsystems.rs/kalendar/"
          BEZ=$(curl -s -o /dev/null -w '%{http_code}' "$ADRESA")
          if [ -n "$HTTP_AUTH_USER" ] && [ -n "$HTTP_AUTH_PASS" ]; then
            SA=$(curl -s -o /dev/null -w '%{http_code}' -u "$HTTP_AUTH_USER:$HTTP_AUTH_PASS" "$ADRESA")
            [ "$BEZ" = "401" ] && [ "$SA" = "200" ] || greska "Провера заштите: без лозинке $BEZ (очекује се 401), са лозинком $SA (очекује се 200)."
            echo "::notice title=Провера::Без лозинке $BEZ, са лозинком $SA."
          else
            [ "$BEZ" = "200" ] || greska "Провера: страна враћа $BEZ (очекује се 200)."
            echo "::notice title=Провера::Страна враћа $BEZ."
          fi
